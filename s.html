<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Follow Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #101a2a;
        }

        /* =========================
           FOLLOW US SECTION
        ========================= */

        .follow-section {
            width: 100%;
            min-height: 450px;
            padding: 35px 7%;
            background: #101a2a;
        }

        /* Heading */

        .follow-section h1 {
            color: #ffffff;
            font-size: 58px;
            font-weight: 600;
            margin-bottom: 95px;
        }

        /* Icons row */

        .social-icons {
            display: flex;
            align-items: center;
            gap: 52px;
        }

        /* =========================
           SOCIAL BUTTON
        ========================= */

        .social-link {
            width: 160px;
            height: 160px;

            border-radius: 50%;

            background: #202d41;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }

        .social-link:hover {
            transform: translateY(-5px);
            background: #29384e;
        }

        /* =========================
           STORAGGE SVG
        ========================= */

        .storagge-svg {
            width: 90px;
            height: 90px;

            display: block;

            /*
             * Important:
             * SVG itself is centered by the parent flex.
             */
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .follow-section {
                padding: 30px;
            }

            .follow-section h1 {
                font-size: 42px;
                margin-bottom: 55px;
            }

            .social-icons {
                gap: 25px;
            }

            .social-link {
                width: 120px;
                height: 120px;
            }

            .storagge-svg {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>

<body>

    <section class="follow-section">

        <h1>Follow Us</h1>

        <div class="social-icons">

            <!-- =========================

            ========================== -->

            <a

</body>
